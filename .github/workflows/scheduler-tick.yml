# Drives the ServiceLens monitoring scheduler on serverless deployments where
# no process lives between requests (Vercel Hobby only allows a daily cron).
# GitHub's minimum cadence is 5 minutes; for tighter probing run `npm run worker`
# on any always-on host instead.
#
# Required repo secrets:
#   SERVICELENS_URL  — e.g. https://servicelens.example.com
#   CRON_SECRET      — same value as the app's CRON_SECRET env var
name: scheduler-tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Tick
        env:
          SERVICELENS_URL: ${{ secrets.SERVICELENS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SERVICELENS_URL" ]; then
            echo "SERVICELENS_URL secret not set — skipping."
            exit 0
          fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SERVICELENS_URL/api/cron/tick"
